<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>西安钟楼 - 3D数字复原</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Microsoft YaHei', 'Noto Serif SC', serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 200;
            color: #fff;
            background: rgba(15, 32, 39, 0.85);
            padding: 12px 24px;
            border-radius: 30px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(136,221,170,0.3);
            pointer-events: none;
            font-size: 14px;
        }
        .back-btn {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 200;
            background: linear-gradient(135deg, #2a6a5a, #1a4a3a);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s;
            border: 1px solid rgba(136,221,170,0.4);
        }
        .back-btn:hover {
            transform: scale(1.03);
            background: #3a8a6a;
        }
        .controls-hint {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 200;
            color: rgba(255,255,255,0.9);
            background: rgba(15,32,39,0.8);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            backdrop-filter: blur(8px);
        }
        .sidebar {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 280px;
            background: rgba(20, 30, 25, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 16px;
            z-index: 150;
            border-left: 3px solid #5aaa7a;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            pointer-events: auto;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(136,221,170,0.3);
        }
        .sidebar h3 {
            color: #88ddaa;
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 2px;
            padding-bottom: 8px;
            border-bottom: 1px solid #5aaa7a;
        }
        .sidebar-item {
            background: rgba(50, 70, 60, 0.7);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            color: #e8f0e8;
            font-size: 13px;
            border-left: 2px solid #5aaa7a;
        }
        .sidebar-item:hover {
            background: #3a6a5a;
            transform: translateX(-3px);
        }
        .sidebar-item.active {
            background: #2a8a6a;
            border-left-color: #ffdd99;
        }
        .sidebar-item .title {
            font-weight: bold;
            margin-bottom: 5px;
            color: #ffdd99;
            font-size: 14px;
        }
        .sidebar-item .desc {
            font-size: 11px;
            color: #bbddbb;
            line-height: 1.4;
        }
        .sidebar-close {
            text-align: right;
            font-size: 18px;
            cursor: pointer;
            color: #88ddaa;
            margin-bottom: 5px;
        }
        .sidebar-close:hover { color: #ffaa66; }
        
        .popup-card {
            position: fixed;
            background: rgba(20, 30, 25, 0.98);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 16px 22px;
            max-width: 340px;
            border-left: 5px solid #5aaa7a;
            font-size: 13px;
            line-height: 1.6;
            color: #e8f0e8;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            pointer-events: auto;
            z-index: 1000;
            animation: fadeInUp 0.3s ease-out;
            border: 1px solid rgba(136,221,170,0.3);
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .popup-card strong {
            color: #88ddaa;
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            letter-spacing: 1px;
        }
        .popup-card .detail-info {
            font-size: 12px;
            color: #aaccaa;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(100,200,150,0.3);
        }
        .popup-card .close-btn {
            position: absolute;
            top: 10px;
            right: 14px;
            color: #aaccaa;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            background: none;
            border: none;
        }
        .popup-card .close-btn:hover { color: #ffaa66; }
        
        .loading-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15,32,39,0.95);
            color: #88dd99;
            padding: 20px 40px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: bold;
            z-index: 300;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid #88dd99;
            pointer-events: none;
        }
        .loading-panel .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(100,200,150,0.3);
            border-top: 3px solid #88dd99;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-msg {
            position: absolute;
            bottom: 120px;
            left: 20px;
            right: 20px;
            background: rgba(15,32,39,0.95);
            color: #ffaa66;
            padding: 15px;
            border-radius: 16px;
            font-size: 13px;
            text-align: center;
            z-index: 300;
            display: none;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,170,102,0.3);
        }
        @media (max-width: 768px) {
            .sidebar { width: 260px; right: 10px; padding: 12px; max-height: 70vh; }
            .sidebar-item { padding: 10px 12px; }
            .sidebar-item .title { font-size: 13px; }
            .popup-card { max-width: 280px; padding: 12px 18px; }
        }
    </style>
</head>
<body>
    <div id="info">🏯 西安钟楼 · 3D数字复原 | 点击右侧列表查看建筑说明</div>
    <button class="back-btn" onclick="goBack()">← 返回地图首页</button>
    <div class="controls-hint">🖱️ 鼠标拖拽旋转视角 | 右键平移 | 滚轮缩放</div>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-close" id="sidebarClose">✕</div>
        <h3>🏯 建筑结构说明</h3>
        <div id="sidebarList"></div>
    </div>
    
    <div class="loading-panel" id="loadingPanel">
        <div class="spinner"></div>
        🏯 正在加载西安钟楼3D模型...<br>
        <span style="font-size: 12px;">GLTF模型加载中，请稍候</span>
    </div>
    <div class="error-msg" id="errorMsg">⚠️ 模型加载失败</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a3a4a);
        scene.fog = new THREE.FogExp2(0x1a3a4a, 0.008);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(6, 4, 10);
        camera.lookAt(0, 1.5, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0';
        labelRenderer.domElement.style.left = '0';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 1.2;
        controls.zoomSpeed = 1.2;
        controls.target.set(0, 1.8, 0);
        
        const ambientLight = new THREE.AmbientLight(0x404060, 0.7);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xfff5e8, 1.4);
        mainLight.position.set(5, 10, 6);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        scene.add(mainLight);
        
        const warmFill = new THREE.PointLight(0xc87e4a, 0.6);
        warmFill.position.set(-3, 3, 5);
        scene.add(warmFill);
        
        const backFill = new THREE.PointLight(0x6a8eb0, 0.5);
        backFill.position.set(2, 3, -6);
        scene.add(backFill);
        
        const groundPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(30, 30),
            new THREE.MeshStandardMaterial({ 
                color: 0x2c5364, 
                roughness: 0.4, 
                metalness: 0.7, 
                transparent: true, 
                opacity: 0.7 
            })
        );
        groundPlane.rotation.x = -Math.PI / 2;
        groundPlane.position.y = -0.3;
        groundPlane.receiveShadow = true;
        scene.add(groundPlane);
        
        const gridHelper = new THREE.GridHelper(30, 25, 0x88aacc, 0x6688aa);
        gridHelper.position.y = -0.25;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.4;
        scene.add(gridHelper);
        
        const buildingParts = [
            {
                name: "🏯 西安钟楼主体",
                content: "<strong>🏯 西安钟楼主体</strong><br>"+
                "始建于明洪武十七年（1384年），通高36米，为中国现存规模最大、保存最完整的明代钟楼。<br>"+
                "主体为砖木抬梁式结构，主要承重柱梁采用<strong>老龄松木、榆木</strong>，全楼木构件约3200件，<br>"+
                "榫卯咬合无铁钉，抗震性能极强，楼体分两层楼室、三层屋檐，整体结构严谨对称。",
                detail: "📏 总高36m｜用材：松木、榆木｜构件约3200件｜结构：抬梁式砖木"
            },
            {
                name: "🟡 鎏金宝顶",
                content: "<strong>🟡 鎏金宝顶</strong><br>"+
                "楼顶为四角攒尖顶，覆盖<strong>鎏金铜瓦</strong>，顶端置5米高铁铸鎏金宝顶。<br>"+
                "铜瓦共计约1100片，单瓦重2.5-3kg，采用紫铜锻造、表面火鎏金，金层厚度约0.1mm，<br>"+
                "历经六百年风雨依旧金光璀璨，是钟楼最具标志性的顶部构件。",
                detail: "✨ 紫铜鎏金｜宝顶高5m｜铜瓦1100片｜单瓦重约3kg"
            },
            {
                name: "🏮 四面券洞",
                content: "<strong>🏮 四面券洞</strong><br>"+
                "台基东西南北四向开设高券门洞，每孔高6m、宽6m、进深37m，<br>"+
                "全部采用<strong>明代青砖</strong>砌筑，砖规格34×17×7cm，单块重约5kg，<br>"+
                "券拱以糯米灰浆勾缝，结构稳固，为旧时古城中心十字交通枢纽。",
                detail: "🚪 高6m宽6m｜青砖34×17×7cm｜糯米灰浆｜总长37m"
            },
            {
                name: "🔔 唐景云钟",
                content: "<strong>🔔 唐景云钟</strong><br>"+
                "铸于唐景云二年（711年），国家一级文物，原悬挂于钟楼顶层。<br>"+
                "钟高2.47m，口径1.65m，重约6吨，采用<strong>铜锡铅三元合金</strong>铸造，<br>"+
                "铜77%、锡14%、铅9%，钟身铭文292字，钟声洪亮可传十余里。",
                detail: "⏳ 唐景云二年｜高2.47m｜重6吨｜合金：铜77%锡14%铅9%"
            },
            {
                name: "🔧 斗拱飞檐",
                content: "<strong>🔧 斗拱飞檐</strong><br>"+
                "全楼共有<strong>斗拱620余朵</strong>，为典型明代官式形制，<br>"+
                "主材选用<strong>楠木、硬榆木</strong>，由斗、拱、昂、枋榫卯拼接，不用一钉。<br>"+
                "出檐深远达3米，既遮阳避雨，又起到结构加固与抗震缓冲作用。",
                detail: "⚙️ 斗拱620朵｜楠木+榆木｜出檐3m｜纯榫卯结构"
            },
            {
                name: "🪨 青石台基",
                content: "<strong>🪨 青石台基</strong><br>"+
                "方形基座边长35.5m，高8.6m，占地约1260㎡，<br>"+
                "内部夯土夯实，外包<strong>明代青砖约12万块</strong>，边缘压面用青石条126根，<br>"+
                "整体厚重稳固，历经六百年沉降极小，承载整座楼阁。",
                detail: "🪨 35.5m×35.5m×8.6m｜青砖12万块｜青石条126根"
            },
            {
                name: "🎨 彩画梁枋",
                content: "<strong>🎨 彩画梁枋</strong><br>"+
                "梁、枋、斗拱遍施<strong>明代旋子彩画</strong>，使用<strong>朱砂、石青、石绿</strong>等矿物颜料，<br>"+
                "柱身朱红，檐部青绿，色彩典雅庄重，兼具装饰与防腐防潮功能，<br>"+
                "为明清官式建筑高等级彩画工艺，尽显皇家建筑气派。",
                detail: "🎨 旋子彩画｜矿物颜料｜朱红柱身｜官式建筑等级"
            }
        ];
        
        let modelScene = null;
        let currentPopup = null;
        let activeItemIndex = -1;
        let closeHandler = null;
        
        function buildSidebar() {
            const container = document.getElementById('sidebarList');
            container.innerHTML = '';
            buildingParts.forEach((part, index) => {
                const item = document.createElement('div');
                item.className = 'sidebar-item';
                item.innerHTML = `
                    <div class="title">${part.name}</div>
                    <div class="desc">${part.detail.substring(0, 45)}...</div>
                `;
                item.onclick = () => selectPart(index);
                container.appendChild(item);
            });
        }
        
        function closePopup() {
            if (currentPopup) {
                document.body.removeChild(currentPopup);
                currentPopup = null;
            }
            if (closeHandler) {
                document.removeEventListener('click', closeHandler);
                closeHandler = null;
            }
        }
        
        function selectPart(index) {
            const part = buildingParts[index];
            closePopup();
            document.querySelectorAll('.sidebar-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
            activeItemIndex = index;
            showPopup(part);
        }
        
        function showPopup(part) {
            const popup = document.createElement('div');
            popup.className = 'popup-card';
            popup.innerHTML = `
                <button class="close-btn" id="popupCloseBtn">✕</button>
                ${part.content}
                <div class="detail-info">📌 ${part.detail}</div>
            `;
            document.body.appendChild(popup);
            currentPopup = popup;
            
            const sidebar = document.getElementById('sidebar');
            const sidebarRect = sidebar.getBoundingClientRect();
            const popupWidth = 340;
            let leftPos = sidebarRect.left - popupWidth - 15;
            if (leftPos < 10) leftPos = sidebarRect.right + 15;
            popup.style.left = `${leftPos}px`;
            popup.style.top = `${sidebarRect.top + 50}px`;
            
            document.getElementById('popupCloseBtn').onclick = (e) => {
                e.stopPropagation();
                closePopup();
            };
            
            closeHandler = (e) => {
                if (currentPopup && !currentPopup.contains(e.target)) closePopup();
            };
            setTimeout(() => {
                document.addEventListener('click', closeHandler);
            }, 100);
        }
        
        const loader = new GLTFLoader();
        const loadingPanel = document.getElementById('loadingPanel');
        const errorMsgDiv = document.getElementById('errorMsg');
        
        const modelPath = 'BellToweOfXian-from-images.gltf';
        
        loader.load(modelPath, 
            (gltf) => {
                modelScene = gltf.scene;
                // ✅ 已向上调整 Y 轴：从 -0.8 → -0.3
                modelScene.position.set(0, -0.3, 0);
                modelScene.scale.set(0.8, 0.8, 0.8);
                modelScene.rotation.set(0.7071, 0, 0, 0.7071);
                
                modelScene.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                
                scene.add(modelScene);
                loadingPanel.style.display = 'none';
                buildSidebar();
                
                const mainTitleDiv = document.createElement('div');
                mainTitleDiv.textContent = '🏯 西 安 钟 楼 🏯';
                mainTitleDiv.style.cssText = `color:#88dd99;font-size:22px;font-weight:bold;background:linear-gradient(135deg, #2a6a5a, #1a4a3a);padding:8px 28px;border-radius:60px;border:2px solid #88dd99;backdrop-filter:blur(8px);white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.5);letter-spacing:4px`;
                const mainLabel = new CSS2DObject(mainTitleDiv);
                mainLabel.position.set(0, 4.5, 0);
                scene.add(mainLabel);
                
                const subDiv = document.createElement('div');
                subDiv.textContent = '长安中轴线 古都第一楼';
                subDiv.style.cssText = `color:#aaddaa;font-size:12px;font-style:italic;background:rgba(15,32,39,0.7);padding:4px 16px;border-radius:30px;backdrop-filter:blur(4px);white-space:nowrap`;
                const subLabel = new CSS2DObject(subDiv);
                subLabel.position.set(0, 4.0, 0);
                scene.add(subLabel);
            },
            (xhr) => {
                const percent = Math.floor((xhr.loaded / xhr.total) * 100);
                loadingPanel.innerHTML = `<div class="spinner"></div>🏯 加载中 ${percent}%<br><span style="font-size:12px;">GLTF模型加载中...</span>`;
            },
            (error) => {
                console.error('模型加载失败:', error);
                loadingPanel.style.display = 'none';
                errorMsgDiv.style.display = 'block';
            }
        );
        
        let sidebarVisible = true;
        const sidebar = document.getElementById('sidebar');
        const sidebarClose = document.getElementById('sidebarClose');
        
        sidebarClose.onclick = () => {
            if (sidebarVisible) {
                sidebar.style.right = '-300px';
                sidebarVisible = false;
                sidebarClose.innerHTML = '☰';
                sidebarClose.style.cssText = 'position:fixed;right:10px;top:50%;background:rgba(20,30,25,0.9);padding:8px 12px;border-radius:30px;font-size:20px;z-index:160;';
            } else {
                sidebar.style.right = '20px';
                sidebarVisible = true;
                sidebarClose.innerHTML = '✕';
                sidebarClose.style = '';
            }
        };
        
        const particleCount = 500;
        const particlesGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            positions[i*3] = (Math.random() - 0.5) * 40;
            positions[i*3+1] = Math.random() * 6;
            positions[i*3+2] = (Math.random() - 0.5) * 30 - 2;
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0xaaddff, size: 0.05, transparent: true, opacity: 0.4 });
        const particlesSys = new THREE.Points(particlesGeo, particleMat);
        scene.add(particlesSys);
        
        const cloudGroup = new THREE.Group();
        const cloudMatTrans = new THREE.MeshStandardMaterial({ color: 0xcceeff, transparent: true, opacity: 0.15 });
        for (let i = 0; i < 25; i++) {
            const cloudPart = new THREE.Mesh(new THREE.SphereGeometry(0.8, 6, 6), cloudMatTrans);
            const rad = (i / 25) * Math.PI * 2;
            cloudPart.position.set(Math.cos(rad) * 10, 4.5 + Math.sin(rad*3)*0.4, Math.sin(rad) * 10);
            cloudGroup.add(cloudPart);
        }
        scene.add(cloudGroup);
        
        const glowMat = new THREE.MeshStandardMaterial({ color: 0x88dd99, emissive: 0x448866, transparent: true, opacity: 0.4 });
        const glowSphere = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), glowMat);
        glowSphere.position.set(0, 3.8, 0);
        scene.add(glowSphere);
        
        let animTime = 0;
        function animate() {
            requestAnimationFrame(animate);
            animTime += 0.006;
            particlesSys.rotation.y += 0.0006;
            cloudGroup.rotation.y += 0.0008;
            if (glowSphere) {
                glowSphere.material.emissiveIntensity = 0.4 + Math.sin(animTime * 2.5) * 0.15;
            }
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        window.goBack = () => {
            window.location.href = '../index.html';
        };
        
        setTimeout(() => {
            if (loadingPanel.style.display !== 'none') {
                loadingPanel.style.display = 'none';
                errorMsgDiv.style.display = 'block';
            }
        }, 15000);
    </script>
</body>
</html>
