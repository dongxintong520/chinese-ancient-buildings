                    <h4>🏛️ ${site.name}</h4>
                    <p>📍 ${site.city}</p>
                    <p>📜 ${site.highlight.substring(0, 60)}</p>
                    <button id="infoWinDetailBtn_${index}">📖 专属详情页</button>
                </div>
            `;
            const infoWindow = new BMap.InfoWindow(infoContent, {
                width: 280,
                height: 150,
                title: "🏛️ 文化遗产速览"
            });
            const point = marker.getPosition();
            map.openInfoWindow(infoWindow, point);
            currentInfoWindow = infoWindow;
            
            setTimeout(() => {
                const btn = document.getElementById(`infoWinDetailBtn_${index}`);
                if (btn) {
                    const newBtn = btn.cloneNode(true);
                    btn.parentNode.replaceChild(newBtn, btn);
                    newBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (site.detailPage) {
                            window.open(site.detailPage, '_blank');
                        } else {
                            alert("详情页面尚未创建");
                        }
                    });
                }
            }, 50);
        });
    }

    function initMap() {
        map = new BMap.Map("chinaMap");
        map.centerAndZoom(new BMap.Point(108.0, 34.0), 5);
        map.enableScrollWheelZoom(true);
        map.enableDragging(true);
        map.setMapType(BMAP_NORMAL_MAP);
        map.addControl(new BMap.ScaleControl());
        map.addControl(new BMap.NavigationControl());
        
        heritageSites.forEach((site, idx) => {
            const point = new BMap.Point(site.lng, site.lat);
            const marker = new BMap.Marker(point);
            marker.setIcon(new BMap.Icon(
                "https://api.map.baidu.com/images/marker_red.png",
                new BMap.Size(23, 25)
            ));
            bindMarkerClick(marker, site, idx);
            map.addOverlay(marker);
            markers.push(marker);
        });
        
        if (heritageSites.length > 0) {
            updateInfoPanelAndButton(heritageSites[0]);
        }
    }
    
    // 导航栏：首页重置地图，建筑掠影和关于我们直接跳转
    function initNavigation() {
        const navHome = document.getElementById('nav-home');
        const navDetail = document.getElementById('nav-detail');
        const navAbout = document.getElementById('nav-about');
        
        function removeActiveClass() {
            document.querySelectorAll('.nav-menu a').forEach(link => link.classList.remove('active'));
        }
        
        // 首页：重置地图
        if (navHome) {
            navHome.addEventListener('click', function(e) {
                e.preventDefault();
                removeActiveClass();
                this.classList.add('active');
                if (map) {
                    map.centerAndZoom(new BMap.Point(108.0, 34.0), 5);
                    if (currentInfoWindow) {
                        map.closeInfoWindow(currentInfoWindow);
                        currentInfoWindow = null;
                    }
                    if (heritageSites.length) {
                        updateInfoPanelAndButton(heritageSites[0]);
                        resetMarkersToRed();
                    }
                }
            });
        }
        
        // 建筑掠影：直接跳转
        if (navDetail) {
            navDetail.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'jianzhuyemian.html';
            });
        }
        
        // 关于我们：直接跳转（不再弹出alert）
        if (navAbout) {
            navAbout.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'women.html';
            });
        }
    }
    
    window.addEventListener('load', function() {
        if (typeof BMap !== 'undefined') {
            initMap();
        } else {
            let retryCount = 0;
            const interval = setInterval(() => {
                if (typeof BMap !== 'undefined') {
                    clearInterval(interval);
                    initMap();
                } else if (retryCount > 40) {
                    clearInterval(interval);
                    alert('百度地图API加载失败，请检查网络或刷新重试。');
                }
                retryCount++;
            }, 200);
        }
        setTimeout(initNavigation, 400);
    });
</script>
</body>
</html>
