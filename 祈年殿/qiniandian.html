<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>祈年殿 · 3D数字复原 | 中国古代建筑巅峰</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Microsoft YaHei', 'Noto Serif SC', serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 12px 24px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            pointer-events: none;
            font-size: 14px;
            z-index: 200;
        }
        .back-btn {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 200;
            background: linear-gradient(135deg, #2a6a5a, #1a4a3a);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s;
        }
        .back-btn:hover {
            transform: scale(1.03);
            background: #3a8a6a;
        }
        .controls-hint {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 200;
            color: rgba(255,255,255,0.8);
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
        }
        .sidebar {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 280px;
            background: rgba(20, 30, 25, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 16px;
            z-index: 150;
            border-left: 3px solid #5aaa7a;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            pointer-events: auto;
            max-height: 80vh;
            overflow-y: auto;
        }
        .sidebar h3 {
            color: #88ddaa;
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 2px;
            padding-bottom: 8px;
            border-bottom: 1px solid #5aaa7a;
        }
        .sidebar-item {
            background: rgba(50, 70, 60, 0.6);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            color: #e8f0e8;
            font-size: 13px;
            border-left: 2px solid #5aaa7a;
        }
        .sidebar-item:hover {
            background: #3a6a5a;
            transform: translateX(-3px);
        }
        .sidebar-item.active {
            background: #2a8a6a;
            border-left-color: #ffdd99;
        }
        .sidebar-item .title {
            font-weight: bold;
            margin-bottom: 5px;
            color: #ffdd99;
            font-size: 14px;
        }
        .sidebar-item .desc {
            font-size: 11px;
            color: #bbddbb;
            line-height: 1.4;
        }
        .sidebar-close {
            text-align: right;
            font-size: 18px;
            cursor: pointer;
            color: #88ddaa;
            margin-bottom: 5px;
        }
        .sidebar-close:hover { color: #ffaa66; }
        
        .popup-card {
            position: fixed;
            background: rgba(20, 30, 25, 0.96);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 16px 22px;
            max-width: 320px;
            border-left: 5px solid #5aaa7a;
            font-size: 13px;
            line-height: 1.6;
            color: #e8f0e8;
            font-family: 'Microsoft YaHei', sans-serif;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            pointer-events: auto;
            z-index: 1000;
            animation: fadeInUp 0.2s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .popup-card strong {
            color: #88ddaa;
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            letter-spacing: 1px;
        }
        .popup-card .detail-info {
            font-size: 12px;
            color: #aaccaa;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(100,200,150,0.3);
        }
        .popup-card .close-btn {
            position: absolute;
            top: 10px;
            right: 14px;
            color: #aaccaa;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            background: none;
            border: none;
        }
        .popup-card .close-btn:hover { color: #ffaa66; }
        
        .loading-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            color: #88dd99;
            padding: 20px 40px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: bold;
            z-index: 300;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid #88dd99;
            pointer-events: none;
        }
        .loading-panel .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(100,200,150,0.3);
            border-top: 3px solid #88dd99;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-msg {
            position: absolute;
            bottom: 120px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.85);
            color: #ffaa66;
            padding: 15px;
            border-radius: 16px;
            font-size: 13px;
            text-align: center;
            z-index: 300;
            display: none;
        }
        @media (max-width: 768px) {
            .sidebar { width: 260px; right: 10px; padding: 12px; max-height: 70vh; }
            .sidebar-item { padding: 10px 12px; }
            .sidebar-item .title { font-size: 13px; }
            .popup-card { max-width: 280px; padding: 12px 18px; }
        }
    </style>
</head>
<body>
    <div id="info">🏛️ 祈年殿 · 3D数字复原 | 点击右侧列表查看建筑说明</div>
    <button class="back-btn" onclick="goBack()">← 返回地图首页</button>
    <div class="controls-hint">🖱️ 鼠标拖拽旋转视角 | 右键平移 | 滚轮缩放</div>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-close" id="sidebarClose">✕</div>
        <h3>🏯 建筑结构说明</h3>
        <div id="sidebarList"></div>
    </div>
    
    <div class="loading-panel" id="loadingPanel">
        <div class="spinner"></div>
        🏛️ 正在加载祈年殿3D模型...<br>
        <span style="font-size: 12px;">GLTF模型加载中，请稍候</span>
    </div>
    <div class="error-msg" id="errorMsg">⚠️ 模型加载失败</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // 初始化场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a3a4a);
        scene.fog = new THREE.FogExp2(0x1a3a4a, 0.008);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(8, 6, 10);
        camera.lookAt(0, 1.5, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 1.2;
        controls.zoomSpeed = 1.2;
        controls.target.set(0, 1.8, 0);
        
        // ====================== 已改：亮度拉到最高 ======================
        const ambientLight = new THREE.AmbientLight(0xffffff, 3.0);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xfff8e8, 5.0);
        mainLight.position.set(10, 20, 10);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        scene.add(mainLight);
        
        const warmFill = new THREE.PointLight(0xffddaa, 2.5);
        warmFill.position.set(-5, 8, 5);
        scene.add(warmFill);
        
        const backFill = new THREE.PointLight(0xaaccff, 1.5);
        backFill.position.set(5, 10, -5);
        scene.add(backFill);
        
        // 地面
        const groundPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 20),
            new THREE.MeshStandardMaterial({ color: 0x3a8aaa, roughness: 0.3, metalness: 0.8, transparent: true, opacity: 0.6 })
        );
        groundPlane.rotation.x = -Math.PI / 2;
        groundPlane.position.y = -0.3;
        groundPlane.receiveShadow = true;
        scene.add(groundPlane);
        
        // 地面网格
        const gridHelper = new THREE.GridHelper(25, 20, 0x88aacc, 0x6688aa);
        gridHelper.position.y = -0.25;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.35;
        scene.add(gridHelper);
        
        // 祈年殿建筑部位数据
        const buildingParts = [
            { name: "🏛️ 祈年殿主体", 
              content: "<strong>🏛️ 祈年殿</strong>始建于明永乐十八年，原名大祀殿，是明清两代皇帝孟春祈谷的专用祭坛，为天坛核心建筑，中国古代木结构建筑的巅峰之作。",
              detail: "📏 高度: 38米 | 🏗️ 结构: 全木榫卯 | ⏳ 始建: 明永乐18年(1420年)" },
            { name: "🎩 三重檐圆形攒尖顶", 
              content: "<strong>🎩 三重檐圆形攒尖顶</strong>三层圆形屋檐层层上收，形如华盖，是中国古建筑中最具代表性的屋顶样式，象征天圆地方。",
              detail: "🏛️ 样式: 三重檐攒尖顶 | ⭐ 特色: 无一根铁钉 | 🎯 寓意: 天人合一" },
            { name: "🔴 鎏金宝顶", 
              content: "<strong>🔴 鎏金宝顶</strong>殿顶中央的鎏金宝珠，高约3米，重约4吨，历经数百年依然金光熠熠，是祈年殿的标志性装饰。",
              detail: "🪙 材质: 鎏金铜质 | 📏 高度: 3米 | ⚖️ 重量: 4吨" },
            { name: "🪵 28根楠木大柱", 
              content: "<strong>🪵 28根楠木大柱</strong>殿内28根金丝楠木大柱，分为龙井柱、金柱、檐柱三层，分别象征四季、十二月、二十四节气，蕴含天文历法智慧。",
              detail: "🌳 材质: 金丝楠木 | 📐 数量: 28根 | 📜 寓意: 天文历法" },
            { name: "🔧 斗拱结构", 
              content: "<strong>🔧 斗拱结构</strong>层层叠叠的斗拱承托三层屋檐，不用一钉一铆，将巨大屋顶重量均匀传递，展现中国古代建筑力学的最高成就。",
              detail: "⚙️ 样式: 明清官式斗拱 | 📐 层数: 五铺作 | 💪 功能: 承重/抗震" },
            { name: "🎨 龙凤和玺彩画", 
              content: "<strong>🎨 龙凤和玺彩画</strong>殿内梁枋遍布最高等级的龙凤和玺彩画，金龙金凤栩栩如生，是清代皇家建筑彩画的典范。",
              detail: "🖌️ 等级: 最高等级 | 🎨 样式: 龙凤和玺 | 🏛️ 适用: 皇家祭坛" },
            { name: "🪨 三层汉白玉台基", 
              content: "<strong>🪨 三层汉白玉台基</strong>高约6米，由三层汉白玉石栏环绕，象征天、地、人三才，稳固承载整座大殿，历经数百年风雨不倒。",
              detail: "🪨 材质: 汉白玉 | 📏 高度: 6米 | 🎯 寓意: 三才" },
            { name: "🌞 龙凤藻井", 
              content: "<strong>🌞 龙凤藻井</strong>殿顶中央的龙凤藻井，由数百块木雕拼接而成，金龙盘绕，工艺精湛，是中国古代木雕艺术的瑰宝。",
              detail: "🎨 工艺: 木雕拼接 | ⭐ 特色: 无钉无铆 | 📜 地位: 国宝级文物" },
            { name: "🏮 檐角走兽", 
              content: "<strong>🏮 檐角走兽</strong>每层檐角排列10只脊兽，是中国古建筑中脊兽数量最多的建筑，象征皇权至高无上。",
              detail: "🐉 数量: 10只 | 🏆 等级: 最高等级 | 🎯 寓意: 辟邪祈福" }
        ];
        
        let modelScene = null;
        let currentPopup = null;
        let activeItemIndex = -1;
        let closeHandler = null;
        
        // 生成侧边栏列表
        function buildSidebar() {
            const container = document.getElementById('sidebarList');
            container.innerHTML = '';
            buildingParts.forEach((part, index) => {
                const item = document.createElement('div');
                item.className = 'sidebar-item';
                item.innerHTML = `
                    <div class="title">${part.name}</div>
                    <div class="desc">${part.detail.substring(0, 45)}...</div>
                `;
                item.onclick = () => selectPart(index);
                container.appendChild(item);
            });
        }
        
        // 关闭弹窗
        function closePopup() {
            if (currentPopup) {
                document.body.removeChild(currentPopup);
                currentPopup = null;
            }
            if (closeHandler) {
                document.removeEventListener('click', closeHandler);
                closeHandler = null;
            }
        }
        
        // 选中部位
        function selectPart(index) {
            const part = buildingParts[index];
            closePopup();
            document.querySelectorAll('.sidebar-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
            activeItemIndex = index;
            showPopup(part);
        }
        
        // 显示弹窗
        function showPopup(part) {
            const popup = document.createElement('div');
            popup.className = 'popup-card';
            popup.innerHTML = `
                <button class="close-btn" id="popupCloseBtn">✕</button>
                ${part.content}
                <div class="detail-info">📌 ${part.detail}</div>
            `;
            document.body.appendChild(popup);
            currentPopup = popup;
            
            const sidebar = document.getElementById('sidebar');
            const sidebarRect = sidebar.getBoundingClientRect();
            const popupWidth = 320;
            let leftPos = sidebarRect.left - popupWidth - 15;
            if (leftPos < 10) leftPos = sidebarRect.right + 15;
            popup.style.left = `${leftPos}px`;
            popup.style.top = `${sidebarRect.top + 50}px`;
            
            document.getElementById('popupCloseBtn').onclick = (e) => {
                e.stopPropagation();
                closePopup();
            };
            
            closeHandler = (e) => {
                if (currentPopup && !currentPopup.contains(e.target)) closePopup();
            };
            setTimeout(() => {
                document.addEventListener('click', closeHandler);
            }, 100);
        }
        
        // ====================== 模型加载（核心修改）======================
        const loader = new GLTFLoader();
        const loadingPanel = document.getElementById('loadingPanel');
        const errorMsgDiv = document.getElementById('errorMsg');
        const modelPath = 'model.gltf';
        
        loader.load(modelPath, 
            (gltf) => {
                console.log('✅ 祈年殿模型加载成功');
                modelScene = gltf.scene;

                // ====================== 已改：建筑再往上抬高 ======================
                modelScene.position.set(0, 3.2, 0);
                modelScene.scale.set(1.0, 1.0, 1.0);

                // ====================== 图层置顶：建筑永远在最上层 ======================
                modelScene.traverse((child) => {
                    if (child.isMesh) {
                        child.renderOrder = 10;    // 图层最高
                        child.depthTest = true;
                        child.castShadow = true;
                    }
                });

                scene.add(modelScene);
                loadingPanel.style.display = 'none';
                buildSidebar();
                
                // 标题
                const mainTitleDiv = document.createElement('div');
                mainTitleDiv.textContent = '🏛️ 祈 年 殿 🏛️';
                mainTitleDiv.style.cssText = `color:#88dd99;font-size:22px;font-weight:bold;background:linear-gradient(135deg, #2a6a5a, #1a4a3a);padding:8px 28px;border-radius:60px;border:2px solid #88dd99;font-family:'KaiTi','Microsoft YaHei';backdrop-filter:blur(8px);white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.5);letter-spacing:4px`;
                const mainLabel = new CSS2DObject(mainTitleDiv);
                mainLabel.position.set(0, 6.5, 0);
                scene.add(mainLabel);
                
                const subDiv = document.createElement('div');
                subDiv.textContent = '天人合一 建筑巅峰';
                subDiv.style.cssText = `color:#aaddaa;font-size:12px;font-style:italic;background:rgba(0,0,0,0.5);padding:4px 16px;border-radius:30px;font-family:'KaiTi','Microsoft YaHei';backdrop-filter:blur(4px);white-space:nowrap`;
                const subLabel = new CSS2DObject(subDiv);
                subLabel.position.set(0, 5.8, 0);
                scene.add(subLabel);
            },
            (xhr) => {
                const percent = Math.floor((xhr.loaded / xhr.total) * 100);
                loadingPanel.innerHTML = `<div class="spinner"></div>🏛️ 加载中 ${percent}%<br><span style="font-size:12px;">GLTF模型加载中...</span>`;
            },
            (error) => {
                console.error('❌ 模型加载失败:', error);
                loadingPanel.style.display = 'none';
                errorMsgDiv.style.display = 'block';
                errorMsgDiv.innerHTML = `⚠️ 模型加载失败: ${error.message || '请检查文件路径'}<br>当前路径: ${modelPath}`;
            }
        );
        
        // 侧边栏收起/展开
        let sidebarVisible = true;
        const sidebar = document.getElementById('sidebar');
        const sidebarClose = document.getElementById('sidebarClose');
        
        sidebarClose.onclick = () => {
            if (sidebarVisible) {
                sidebar.style.right = '-300px';
                sidebarVisible = false;
                sidebarClose.innerHTML = '☰';
                sidebarClose.style.cssText = 'position:fixed;right:10px;top:50%;background:rgba(20,30,25,0.9);padding:8px 12px;border-radius:30px;font-size:20px;z-index:160;';
            } else {
                sidebar.style.right = '20px';
                sidebarVisible = true;
                sidebarClose.innerHTML = '✕';
                sidebarClose.style = '';
            }
        };
        
        // 漂浮粒子
        const particleCount = 400;
        const particlesGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            positions[i*3] = (Math.random() - 0.5) * 30;
            positions[i*3+1] = Math.random() * 3;
            positions[i*3+2] = (Math.random() - 0.5) * 25 - 2;
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0xaaddff, size: 0.04, transparent: true, opacity: 0.3 });
        const particlesSys = new THREE.Points(particlesGeo, particleMat);
        scene.add(particlesSys);
        
        // 云层
        const cloudGroup = new THREE.Group();
        const cloudMatTrans = new THREE.MeshStandardMaterial({ color: 0xcceeff, transparent: true, opacity: 0.1 });
        for (let i = 0; i < 20; i++) {
            const cloudPart = new THREE.Mesh(new THREE.SphereGeometry(0.7, 6, 6), cloudMatTrans);
            const rad = (i / 20) * Math.PI * 2;
            cloudPart.position.set(Math.cos(rad) * 8, 4.2 + Math.sin(rad*2)*0.3, Math.sin(rad) * 8);
            cloudGroup.add(cloudPart);
        }
        scene.add(cloudGroup);
        
        // 楼顶光晕
        const glowMat = new THREE.MeshStandardMaterial({ color: 0x88dd99, emissive: 0x448866, transparent: true, opacity: 0.3 });
        const glowSphere = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 12), glowMat);
        glowSphere.position.set(0, 5.0, 0);
        scene.add(glowSphere);
        
        let animTime = 0;
        function animate() {
            requestAnimationFrame(animate);
            animTime += 0.006;
            particlesSys.rotation.y += 0.0005;
            cloudGroup.rotation.y += 0.0006;
            if (glowSphere) {
                glowSphere.material.emissiveIntensity = 0.3 + Math.sin(animTime * 2) * 0.1;
            }
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        window.goBack = () => {
            window.location.href = 'bisai.html';
        };
        
        setTimeout(() => {
            if (loadingPanel.style.display !== 'none') {
                loadingPanel.style.display = 'none';
                errorMsgDiv.style.display = 'block';
            }
        }, 15000);
