const scene = new THREE.Scene();
// 岳阳楼风格场景背景：湖蓝色渐变（洞庭湖色调）
scene.background = new THREE.Color(0x204a60);
// 岳阳楼风格雾效：浅蓝灰雾
scene.fog = new THREE.FogExp2(0x204a60, 0.008);
const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(8,5,12);
camera.lookAt(0, 1.5, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// 岳阳楼风格光照：暖黄主光+青蓝补光（模拟湖光天色）
const ambientLight = new THREE.AmbientLight(0x607080, 1.0);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffe0b0, 2.0); // 暖黄光
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
scene.add(dirLight);
const warmFill = new THREE.PointLight(0xd88a50, 0.6); // 赭石色补光
warmFill.position.set(-3, 3, 5);
scene.add(warmFill);
const backFill = new THREE.PointLight(0x60a0c0, 0.5); // 湖蓝色补光
backFill.position.set(2, 3, -6);
scene.add(backFill);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.rotateSpeed = 1.2;
controls.zoomSpeed = 1.2;
controls.target.set(0, 1.8, 0);
controls.enablePan = true; // 右键平移开启

// 岳阳楼风格地面：仿洞庭湖岸石材质感
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(30,30),
    new THREE.MeshStandardMaterial({ 
        color: 0x3a5a6a, // 青灰色地面
        roughness: 0.9, 
        metalness: 0.1,
        transparent: true,
        opacity: 0.85
    })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -4;
ground.receiveShadow = true;
scene.add(ground);

// 岳阳楼风格网格辅助线：浅蓝灰色
const gridHelper = new THREE.GridHelper(25, 20, 0xa0b0c0, 0x607080);
gridHelper.position.y = -4;
gridHelper.material.transparent = true;
gridHelper.material.opacity = 0.4;
scene.add(gridHelper);

// 岳阳楼风格粒子：暖白色光点（模拟湖面波光）
const particleCount = 300;
const particlesGeo = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount; i++) {
    positions[i*3] = (Math.random() - 0.5) * 30;
    positions[i*3+1] = Math.random() * 5;
    positions[i*3+2] = (Math.random() - 0.5) * 30;
}
particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const particleMat = new THREE.PointsMaterial({ 
    color: 0xfff0e0, // 暖白色粒子
    size: 0.06, 
    transparent: true, 
    opacity: 0.5 
});
const particlesSys = new THREE.Points(particlesGeo, particleMat);
scene.add(particlesSys);

buildSidebar();
function buildSidebar() {
    const list = document.getElementById('sidebarList');
    list.innerHTML = '';
    buildingParts.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = `sidebar-item ${idx === activeItemIndex ? 'active' : ''}`;
        div.innerHTML = `
            <div class="title">${item.name}</div>
            <div class="detail">${item.detail}</div>
        `;
        div.onclick = () => selectPart(idx);
        list.appendChild(div);
    });
}
function selectPart(index) {
    if (currentCard) currentCard.remove();
    document.querySelectorAll('.sidebar-item').forEach((item, i) => {
        if (i === index) {
            item.classList.add('active');
        } else {
            item.classList.remove('active');
        }
    });
    activeItemIndex = index;
    const item = buildingParts[index];
    showCard(item);
}
function showCard(item) {
    const card = document.createElement('div');
    card.className = 'popup-card';
    card.innerHTML = `<button class="close-btn" onclick="this.parentElement.remove(); resetActiveItem()">✕</button>${item.content}`;
    document.body.appendChild(card);
    currentCard = card;
    const sidebar = document.getElementById('sidebar');
    const sidebarRect = sidebar.getBoundingClientRect();
    const popupWidth = 400;
    let leftPos = sidebarRect.left - popupWidth - 15;
    if (leftPos < 10) {
        leftPos = sidebarRect.right + 15;
    }
    card.style.left = `${leftPos}px`;
    card.style.top = `${sidebarRect.top + 50}px`;
}
function resetActiveItem() {
    document.querySelectorAll('.sidebar-item').forEach(item => {
        item.classList.remove('active');
    });
    activeItemIndex = -1;
    currentCard = null;
}

let sidebarVisible = true;
const sidebar = document.getElementById('sidebar');
const sidebarClose = document.getElementById('sidebarClose');
sidebarClose.onclick = () => {
    if (sidebarVisible) {
        sidebar.style.right = '-320px';
        sidebarVisible = false;
        sidebarClose.innerHTML = '☰';
        sidebarClose.style.position = 'fixed';
        sidebarClose.style.right = '10px';
        sidebarClose.style.top = '50%';
        sidebarClose.style.background = 'rgba(18, 40, 50, 0.9)';
        sidebarClose.style.padding = '8px 12px';
        sidebarClose.style.borderRadius = '30px';
        sidebarClose.style.fontSize = '20px';
        sidebarClose.style.zIndex = '160';
    } else {
        sidebar.style.right = '20px';
        sidebarVisible = true;
        sidebarClose.innerHTML = '✕';
        sidebarClose.style.position = '';
        sidebarClose.style.right = '';
        sidebarClose.style.top = '';
        sidebarClose.style.background = '';
        sidebarClose.style.padding = '';
        sidebarClose.style.borderRadius = '';
        sidebarClose.style.fontSize = '';
        sidebarClose.style.zIndex = '';
    }
};

const loader = new THREE.GLTFLoader();
let modelLoaded = false;
const loadingPanel = document.getElementById('loadingPanel');
const errorMsgDiv = document.getElementById('errorMsg');
loader.load(
    MODEL_FILE,
    (gltf) => {
        const m = gltf.scene;
        m.position.y = -1;
        m.scale.set(1,1,1);
        m.traverse((child) => {
            if (child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;
            }
        });
        scene.add(m);
        modelLoaded = true;
        loadingPanel.style.display = 'none';
    },
    (xhr) => {
        const p = Math.floor(xhr.loaded / xhr.total * 100);
        loadingPanel.innerHTML = `<div class="spinner"></div>加载中 ${p}%`;
    },
    (err) => {
        console.log('模型加载失败，但资料正常', err);
        loadingPanel.style.display = 'none';
        errorMsgDiv.style.display = 'block';
    }
);

let animTime = 0;
function animate() {
    requestAnimationFrame(animate);
    animTime += 0.006;
    if (particlesSys) {
        particlesSys.rotation.y += 0.0005;
    }
    controls.update();
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (currentCard && activeItemIndex >= 0) {
        const item = buildingParts[activeItemIndex];
        const sidebar = document.getElementById('sidebar');
        const sidebarRect = sidebar.getBoundingClientRect();
        const popupWidth = 400;
        let leftPos = sidebarRect.left - popupWidth - 15;
        if (leftPos < 10) {
            leftPos = sidebarRect.right + 15;
        }
        currentCard.style.left = `${leftPos}px`;
        currentCard.style.top = `${sidebarRect.top + 50}px`;
    }
});

window.goBack = () => {
    window.location.href = 'bisai.html';
};

setTimeout(() => {
    if (!modelLoaded && loadingPanel.style.display !== 'none') {
        loadingPanel.style.display = 'none';
        errorMsgDiv.style.display = 'block';
    }
}, 15000);
</script>
</body>
</html>
