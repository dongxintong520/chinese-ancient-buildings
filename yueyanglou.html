<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>岳阳楼 · 3D数字复原 | 中国古代工程奇迹</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Microsoft YaHei', 'Noto Serif SC', serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 12px 24px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            pointer-events: none;
            font-size: 14px;
            z-index: 200;
        }
        .back-btn {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 200;
            background: linear-gradient(135deg, #2a6a5a, #1a4a3a);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s;
        }
        .back-btn:hover {
            transform: scale(1.03);
            background: #3a8a6a;
        }
        .controls-hint {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 200;
            color: rgba(255,255,255,0.8);
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
        }
        .sidebar {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 280px;
            background: rgba(20, 30, 25, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 16px;
            z-index: 150;
            border-left: 3px solid #5aaa7a;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            pointer-events: auto;
            max-height: 80vh;
            overflow-y: auto;
        }
        .sidebar h3 {
            color: #88ddaa;
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 2px;
            padding-bottom: 8px;
            border-bottom: 1px solid #5aaa7a;
        }
        .sidebar-item {
            background: rgba(50, 70, 60, 0.6);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            color: #e8f0e8;
            font-size: 13px;
            border-left: 2px solid #5aaa7a;
        }
        .sidebar-item:hover {
            background: #3a6a5a;
            transform: translateX(-3px);
        }
        .sidebar-item.active {
            background: #2a8a6a;
            border-left-color: #ffdd99;
        }
        .sidebar-item .title {
            font-weight: bold;
            margin-bottom: 5px;
            color: #ffdd99;
            font-size: 14px;
        }
        .sidebar-item .desc {
            font-size: 11px;
            color: #bbddbb;
            line-height: 1.4;
        }
        .sidebar-close {
            text-align: right;
            font-size: 18px;
            cursor: pointer;
            color: #88ddaa;
            margin-bottom: 5px;
        }
        .sidebar-close:hover { color: #ffaa66; }
        
        .popup-card {
            position: fixed;
            background: rgba(20, 30, 25, 0.96);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 16px 22px;
            max-width: 320px;
            border-left: 5px solid #5aaa7a;
            font-size: 13px;
            line-height: 1.6;
            color: #e8f0e8;
            font-family: 'Microsoft YaHei', sans-serif;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            pointer-events: auto;
            z-index: 1000;
            animation: fadeInUp 0.2s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .popup-card strong {
            color: #88ddaa;
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            letter-spacing: 1px;
        }
        .popup-card .detail-info {
            font-size: 12px;
            color: #aaccaa;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(100,200,150,0.3);
        }
        .popup-card .close-btn {
            position: absolute;
            top: 10px;
            right: 14px;
            color: #aaccaa;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            background: none;
            border: none;
        }
        .popup-card .close-btn:hover { color: #ffaa66; }
        
        .loading-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            color: #88dd99;
            padding: 20px 40px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: bold;
            z-index: 300;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid #88dd99;
            pointer-events: none;
        }
        .loading-panel .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(100,200,150,0.3);
            border-top: 3px solid #88dd99;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-msg {
            position: absolute;
            bottom: 120px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.85);
            color: #ffaa66;
            padding: 15px;
            border-radius: 16px;
            font-size: 13px;
            text-align: center;
            z-index: 300;
            display: none;
        }
        @media (max-width: 768px) {
            .sidebar { width: 260px; right: 10px; padding: 12px; max-height: 70vh; }
            .sidebar-item { padding: 10px 12px; }
            .sidebar-item .title { font-size: 13px; }
            .popup-card { max-width: 280px; padding: 12px 18px; }
        }
    </style>
</head>
<body>
    <div id="info">🏛️ 岳阳楼 · 3D数字复原 | 点击右侧列表查看建筑说明</div>
    <button class="back-btn" onclick="goBack()">← 返回地图首页</button>
    <div class="controls-hint">🖱️ 鼠标拖拽旋转视角 | 右键平移 | 滚轮缩放</div>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-close" id="sidebarClose">✕</div>
        <h3>🏯 建筑结构说明</h3>
        <div id="sidebarList"></div>
    </div>
    
    <div class="loading-panel" id="loadingPanel">
        <div class="spinner"></div>
        🏯 正在加载岳阳楼3D模型...<br>
        <span style="font-size: 12px;">GLTF模型加载中，请稍候</span>
    </div>
    <div class="error-msg" id="errorMsg">⚠️ 模型加载失败</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // 初始化场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a3a4a);
        scene.fog = new THREE.FogExp2(0x1a3a4a, 0.008);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(6, 4, 10);
        camera.lookAt(0, 1.5, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 1.2;
        controls.zoomSpeed = 1.2;
        controls.target.set(0, 1.8, 0);
        
        // 光照系统
        const ambientLight = new THREE.AmbientLight(0x404060, 0.65);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xfff5e8, 1.3);
        mainLight.position.set(5, 10, 4);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        scene.add(mainLight);
        
        const warmFill = new THREE.PointLight(0xc87e4a, 0.5);
        warmFill.position.set(-3, 3, 5);
        scene.add(warmFill);
        
        const backFill = new THREE.PointLight(0x6a8eb0, 0.45);
        backFill.position.set(2, 3, -6);
        scene.add(backFill);
        
        // 湖面
        const waterPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 20),
            new THREE.MeshStandardMaterial({ color: 0x3a8aaa, roughness: 0.3, metalness: 0.8, transparent: true, opacity: 0.6 })
        );
        waterPlane.rotation.x = -Math.PI / 2;
        waterPlane.position.y = -0.3;
        waterPlane.receiveShadow = true;
        scene.add(waterPlane);
        
        // 地面网格
        const gridHelper = new THREE.GridHelper(25, 20, 0x88aacc, 0x6688aa);
        gridHelper.position.y = -0.25;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.35;
        scene.add(gridHelper);
        
        // 建筑部位数据
        const buildingParts = [
            { name: "🏛️ 岳阳楼主楼", 
              content: "<strong>🏛️ 岳阳楼主楼</strong>三层四柱，飞檐斗拱，纯木结构，高19.42米，是江南三大名楼中唯一保持原貌的古建筑。",
              detail: "📏 高度: 19.42米 | 🏗️ 结构: 纯木榫卯 | 🏆 地位: 江南三大名楼" },
            { name: "🎩 盔顶式屋顶", 
              content: "<strong>🎩 盔顶式屋顶</strong>岳阳楼独特的盔顶造型，形如古代将军头盔，是中国古建筑中独一无二的屋顶样式。",
              detail: "🏛️ 样式: 盔顶 | ⭐ 特色: 国内唯一 | 🎯 寓意: 威仪庄严" },
            { name: "🦅 飞檐翘角", 
              content: "<strong>🦅 飞檐翘角</strong>三层飞檐，翼角高翘，如大鹏展翅，既美观又利于排水，展现湘楚建筑灵动之美。",
              detail: "📐 层数: 三层飞檐 | 🎨 风格: 湘楚特色 | 💧 功能: 排水/装饰" },
            { name: "📜 《岳阳楼记》雕屏", 
              content: "<strong>📜 《岳阳楼记》雕屏</strong>清代书法家张照所书，12块紫檀木雕屏，'先天下之忧而忧，后天下之乐而乐'千古名句。",
              detail: "🖌️ 作者: 张照 | 📏 数量: 12块 | 🌳 材质: 紫檀木" },
            { name: "🔧 斗拱结构", 
              content: "<strong>🔧 斗拱结构</strong>清代重修保留宋式斗拱，层层出挑，承托屋檐，展现中国古代建筑力学之美。",
              detail: "🏛️ 朝代: 清代重修 | ⚙️ 样式: 宋式斗拱 | 📐 层数: 五铺作" },
            { name: "🌊 洞庭湖观景台", 
              content: "<strong>🌊 洞庭湖观景台</strong>临湖而立，可远眺君山岛，'气蒸云梦泽，波撼岳阳城'的壮阔景象尽收眼底。",
              detail: "🏞️ 景观: 洞庭湖 | ⛰️ 远眺: 君山岛 | 📜 诗句: 孟浩然/杜甫" },
            { name: "🏛️ 花岗岩台基", 
              content: "<strong>🏛️ 花岗岩台基</strong>高约1.5米，稳固坚实，历经千年水患而不倒，是岳阳楼的坚实基础。",
              detail: "🪨 材质: 花岗岩 | 📏 高度: 1.5米 | ⏳ 历史: 千年稳固" },
            { name: "🎨 历代碑廊", 
              content: "<strong>🎨 历代碑廊</strong>保存历代文人墨客题咏石刻，包括李白、杜甫、白居易等名家诗作。",
              detail: "📜 年代: 唐宋至清 | 🖌️ 名家: 李白/杜甫/白居易 | 📏 数量: 60余方" }
        ];
        
        let modelScene = null;
        let currentPopup = null;
        let activeItemIndex = -1;
        let closeHandler = null;  // 存储关闭事件处理器，用于移除
        
        // 生成侧边栏列表
        function buildSidebar() {
            const container = document.getElementById('sidebarList');
            container.innerHTML = '';
            buildingParts.forEach((part, index) => {
                const item = document.createElement('div');
                item.className = 'sidebar-item';
                item.innerHTML = `
                    <div class="title">${part.name}</div>
                    <div class="desc">${part.detail.substring(0, 45)}...</div>
                `;
                item.onclick = () => selectPart(index);
                container.appendChild(item);
            });
        }
        
        // 关闭弹窗的函数
        function closePopup() {
            if (currentPopup) {
                document.body.removeChild(currentPopup);
                currentPopup = null;
            }
            // 移除全局点击监听器
            if (closeHandler) {
                document.removeEventListener('click', closeHandler);
                closeHandler = null;
            }
        }
        
        // 选中部位 - 只显示弹窗，不旋转相机
        function selectPart(index) {
            const part = buildingParts[index];
            
            // 先关闭已有弹窗
            closePopup();
            
            // 高亮侧边栏项
            document.querySelectorAll('.sidebar-item').forEach((item, i) => {
                if (i === index) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
            activeItemIndex = index;
            
            // 显示新弹窗
            showPopup(part);
        }
        
        // 显示弹窗（固定位置）
        function showPopup(part) {
            const popup = document.createElement('div');
            popup.className = 'popup-card';
            popup.innerHTML = `
                <button class="close-btn" id="popupCloseBtn">✕</button>
                ${part.content}
                <div class="detail-info">📌 ${part.detail}</div>
            `;
            document.body.appendChild(popup);
            currentPopup = popup;
            
            // 弹窗显示在侧边栏左侧
            const sidebar = document.getElementById('sidebar');
            const sidebarRect = sidebar.getBoundingClientRect();
            const popupWidth = 320;
            
            let leftPos = sidebarRect.left - popupWidth - 15;
            if (leftPos < 10) {
                leftPos = sidebarRect.right + 15;
            }
            popup.style.left = `${leftPos}px`;
            popup.style.top = `${sidebarRect.top + 50}px`;
            
            // 关闭按钮事件
            const closeBtn = document.getElementById('popupCloseBtn');
            if (closeBtn) {
                closeBtn.onclick = (e) => {
                    e.stopPropagation();
                    closePopup();
                };
            }
            
            // 点击弹窗外部关闭
            closeHandler = (e) => {
                if (currentPopup && !currentPopup.contains(e.target)) {
                    closePopup();
                }
            };
            // 延迟添加监听，避免立即触发
            setTimeout(() => {
                document.addEventListener('click', closeHandler);
            }, 100);
        }
        
        // 加载GLTF模型
        const loader = new GLTFLoader();
        let modelLoaded = false;
        const loadingPanel = document.getElementById('loadingPanel');
        const errorMsgDiv = document.getElementById('errorMsg');
        
        // 请根据您的实际路径修改这里
        const modelPath = 'yueyanglou_model/scene.gltf';  // 方案A：子文件夹
        // const modelPath = 'yueyanglou.gltf';  // 方案B：同一目录
        
        console.log('尝试加载模型:', modelPath);
        
        loader.load(modelPath, 
            (gltf) => {
                console.log('✅ 岳阳楼模型加载成功');
                modelScene = gltf.scene;
                modelScene.position.set(0, -0.8, 0);
                modelScene.scale.set(0.8, 0.8, 0.8);
                
                modelScene.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                
                scene.add(modelScene);
                modelLoaded = true;
                loadingPanel.style.display = 'none';
                
                buildSidebar();
                
                // 添加主标题
                const mainTitleDiv = document.createElement('div');
                mainTitleDiv.textContent = '🏛️ 岳 阳 楼  🏛️';
                mainTitleDiv.style.cssText = `color:#88dd99;font-size:22px;font-weight:bold;background:linear-gradient(135deg, #2a6a5a, #1a4a3a);padding:8px 28px;border-radius:60px;border:2px solid #88dd99;font-family:'KaiTi','Microsoft YaHei';backdrop-filter:blur(8px);white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.5);letter-spacing:4px`;
                const mainLabel = new CSS2DObject(mainTitleDiv);
                mainLabel.position.set(0, 4.5, 0);
                scene.add(mainLabel);
                
                const subDiv = document.createElement('div');
                subDiv.textContent = '先天下之忧而忧，后天下之乐而乐';
                subDiv.style.cssText = `color:#aaddaa;font-size:12px;font-style:italic;background:rgba(0,0,0,0.5);padding:4px 16px;border-radius:30px;font-family:'KaiTi','Microsoft YaHei';backdrop-filter:blur(4px);white-space:nowrap`;
                const subLabel = new CSS2DObject(subDiv);
                subLabel.position.set(0, 4.0, 0);
                scene.add(subLabel);
            },
            (xhr) => {
                const percent = Math.floor((xhr.loaded / xhr.total) * 100);
                if (loadingPanel) {
                    loadingPanel.innerHTML = `<div class="spinner"></div>🏯 加载中 ${percent}%<br><span style="font-size:12px;">GLTF模型加载中...</span>`;
                }
            },
            (error) => {
                console.error('❌ 模型加载失败:', error);
                loadingPanel.style.display = 'none';
                errorMsgDiv.style.display = 'block';
                errorMsgDiv.innerHTML = `⚠️ 模型加载失败: ${error.message || '请检查文件路径'}<br>当前路径: ${modelPath}`;
            }
        );
        
        // 侧边栏收起/展开功能
        let sidebarVisible = true;
        const sidebar = document.getElementById('sidebar');
        const sidebarClose = document.getElementById('sidebarClose');
        let originalCloseStyle = {};
        
        sidebarClose.onclick = () => {
            if (sidebarVisible) {
                sidebar.style.right = '-300px';
                sidebarVisible = false;
                sidebarClose.innerHTML = '☰';
                sidebarClose.style.position = 'fixed';
                sidebarClose.style.right = '10px';
                sidebarClose.style.top = '50%';
                sidebarClose.style.background = 'rgba(20,30,25,0.9)';
                sidebarClose.style.padding = '8px 12px';
                sidebarClose.style.borderRadius = '30px';
                sidebarClose.style.fontSize = '20px';
                sidebarClose.style.zIndex = '160';
            } else {
                sidebar.style.right = '20px';
                sidebarVisible = true;
                sidebarClose.innerHTML = '✕';
                sidebarClose.style.position = '';
                sidebarClose.style.right = '';
                sidebarClose.style.top = '';
                sidebarClose.style.background = '';
                sidebarClose.style.padding = '';
                sidebarClose.style.borderRadius = '';
                sidebarClose.style.fontSize = '';
                sidebarClose.style.zIndex = '';
            }
        };
        
        // 漂浮粒子
        const particleCount = 400;
        const particlesGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            positions[i*3] = (Math.random() - 0.5) * 30;
            positions[i*3+1] = Math.random() * 3;
            positions[i*3+2] = (Math.random() - 0.5) * 25 - 2;
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0xaaddff, size: 0.04, transparent: true, opacity: 0.3 });
        const particlesSys = new THREE.Points(particlesGeo, particleMat);
        scene.add(particlesSys);
        
        // 云层
        const cloudGroup = new THREE.Group();
        const cloudMatTrans = new THREE.MeshStandardMaterial({ color: 0xcceeff, transparent: true, opacity: 0.1 });
        for (let i = 0; i < 20; i++) {
            const cloudPart = new THREE.Mesh(new THREE.SphereGeometry(0.7, 6, 6), cloudMatTrans);
            const rad = (i / 20) * Math.PI * 2;
            cloudPart.position.set(Math.cos(rad) * 8, 4.2 + Math.sin(rad*2)*0.3, Math.sin(rad) * 8);
            cloudGroup.add(cloudPart);
        }
        scene.add(cloudGroup);
        
        // 楼顶光晕
        const glowMat = new THREE.MeshStandardMaterial({ color: 0x88dd99, emissive: 0x448866, transparent: true, opacity: 0.3 });
        const glowSphere = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 12), glowMat);
        glowSphere.position.set(0, 3.8, 0);
        scene.add(glowSphere);
        
        let animTime = 0;
        function animate() {
            requestAnimationFrame(animate);
            animTime += 0.006;
            particlesSys.rotation.y += 0.0005;
            cloudGroup.rotation.y += 0.0006;
            if (glowSphere) {
                const intensity = 0.3 + Math.sin(animTime * 2) * 0.1;
                glowSphere.material.emissiveIntensity = intensity;
            }
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            if (currentPopup && activeItemIndex >= 0) {
                const part = buildingParts[activeItemIndex];
                const sidebar = document.getElementById('sidebar');
                const sidebarRect = sidebar.getBoundingClientRect();
                const popupWidth = 320;
                let leftPos = sidebarRect.left - popupWidth - 15;
                if (leftPos < 10) {
                    leftPos = sidebarRect.right + 15;
                }
                currentPopup.style.left = `${leftPos}px`;
                currentPopup.style.top = `${sidebarRect.top + 50}px`;
            }
        });
        
        window.goBack = () => {
            window.location.href = 'index.html';
        };
        
        setTimeout(() => {
            if (!modelLoaded && loadingPanel.style.display !== 'none') {
                loadingPanel.style.display = 'none';
                errorMsgDiv.style.display = 'block';
            }
        }, 15000);
    </script>
</body>
</html>
