<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>福建土楼 · 3D数字复原 | 云霭缭绕 客家奇迹</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { margin: 0; overflow: hidden; font-family: 'Microsoft YaHei', serif; }
        #info {
            position: absolute; top: 20px; left: 20px; z-index: 200;
            color: white; background: rgba(0,0,0,0.6); padding: 10px 20px;
            border-radius: 30px; backdrop-filter: blur(8px); font-size: 14px;
            pointer-events: none;
        }
        .back-btn {
            position: absolute; bottom: 30px; left: 30px; z-index: 200;
            background: linear-gradient(135deg, #8B4513, #6a3510); color: white;
            border: none; padding: 12px 28px; border-radius: 40px;
            font-size: 16px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: all 0.3s;
        }
        .back-btn:hover { transform: scale(1.03); background: #9b5520; }
        .controls-hint {
            position: absolute; bottom: 30px; right: 30px; z-index: 200;
            color: rgba(255,255,255,0.8); background: rgba(0,0,0,0.5);
            padding: 8px 16px; border-radius: 20px; font-size: 12px;
            pointer-events: none;
        }
        .sidebar {
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
            width: 290px; background: rgba(20,30,25,0.95); border-radius: 18px;
            padding: 18px; z-index: 150; color: #e8f0e8; max-height: 80vh;
            overflow-y: auto; border: 1px solid #6688aa; backdrop-filter: blur(12px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3); border-left: 3px solid #ffdd99;
            transition: right 0.3s ease;
        }
        .sidebar h3 { color: #ffdd99; text-align: center; margin-top: 0;
            padding-bottom: 10px; border-bottom: 1px solid #6688aa; font-size: 18px; }
        .sidebar-item {
            background: rgba(60,80,70,0.6); border-radius: 10px; padding: 12px;
            margin-bottom: 8px; cursor: pointer; transition: 0.2s;
            border-left: 2px solid #ffdd99;
        }
        .sidebar-item:hover { background: #4a6a5a; transform: translateX(-3px); }
        .sidebar-item.active { background: #5a7a6a; border-left-color: #8B4513; }
        .sidebar-item .title { font-weight: bold; color: #ffdd99; margin-bottom: 4px; font-size: 14px; }
        .sidebar-item .detail { font-size: 11px; color: #cccccc; line-height: 1.4; }
        .sidebar-close { text-align: right; cursor: pointer; font-size: 18px; color: #ffdd99; margin-bottom: 5px; }
        .popup-card {
            position: fixed; background: rgba(20,30,25,0.98); border-radius: 18px;
            padding: 20px 24px; max-width: 400px; z-index: 1000; color: #e8f0e8;
            line-height: 1.7; border-left: 4px solid #ffdd99; backdrop-filter: blur(12px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .close-btn { position: absolute; top: 12px; right: 16px; background: none;
            border: none; color: #ffdd99; font-size: 18px; cursor: pointer; }
        .loading-panel {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            background: rgba(0,0,0,0.85); color: #ffdd99; padding: 20px 40px;
            border-radius: 60px; font-size: 16px; z-index: 300; text-align: center;
            backdrop-filter: blur(10px); border: 1px solid #ffdd99;
        }
        .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,221,153,0.3);
            border-top: 3px solid #ffdd99; border-radius: 50%; animation: spin 1s linear infinite;
            margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-msg { position: absolute; bottom: 120px; left: 20px; right: 20px;
            background: rgba(0,0,0,0.85); color: #ff6666; padding: 15px; border-radius: 16px;
            text-align: center; z-index: 300; display: none; }
    </style>
</head>
<body>
<div id="info">🏯 福建土楼 · 3D数字复原 | 云霭缭绕 客家奇迹</div>
<button class="back-btn" onclick="goBack()">← 返回地图首页</button>
<div class="controls-hint">🖱️ 鼠标拖拽旋转 | 右键平移 | 滚轮缩放 | 动态云层粒子</div>
<div class="sidebar" id="sidebar">
    <div class="sidebar-close" id="sidebarClose">✕</div>
    <h3>🏯 土楼建筑资料说明</h3>
    <div id="sidebarList"></div>
</div>
<div class="loading-panel" id="loadingPanel">
    <div class="spinner"></div>
    正在加载 3D 模型...
</div>
<div class="error-msg" id="errorMsg">模型加载失败，请检查文件完整性</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.min.js"></script>

<script>
const MODEL_FILE = 'model.gltf';

// 场景初始化
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3a8cba);
scene.fog = new THREE.FogExp2(0x3a8cba, 0.002);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100000);
camera.position.set(0, 60, 350);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.rotateSpeed = 1.0;
controls.zoomSpeed = 1.2;
controls.target.set(0, 20, 0);

// ========== 云层粒子系统 ==========
const cloudGroup = new THREE.Group();

// 白色云粒子（半透明，漂浮）
const cloudMat = new THREE.PointsMaterial({ color: 0xd8eaff, size: 0.9, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending });
const cloudPositions = [];
for (let i = 0; i < 2000; i++) {
    const radius = 45 + Math.random() * 100;
    const angle = Math.random() * Math.PI * 2;
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;
    const y = 15 + Math.random() * 45;
    cloudPositions.push(x, y, z);
}
const cloudGeo = new THREE.BufferGeometry();
cloudGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(cloudPositions), 3));
const cloudPoints = new THREE.Points(cloudGeo, cloudMat);
cloudGroup.add(cloudPoints);

// 暖色光晕粒子（环绕土楼）
const glowMat = new THREE.PointsMaterial({ color: 0xffcc88, size: 0.5, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending });
const glowPositions = [];
for (let i = 0; i < 1200; i++) {
    const radius = 28 + Math.random() * 60;
    const angle = Math.random() * Math.PI * 2;
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;
    const y = 5 + Math.random() * 35;
    glowPositions.push(x, y, z);
}
const glowGeo = new THREE.BufferGeometry();
glowGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(glowPositions), 3));
const glowPoints = new THREE.Points(glowGeo, glowMat);
cloudGroup.add(glowPoints);

// 高空薄云
const highMat = new THREE.PointsMaterial({ color: 0xfff5e6, size: 1.1, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending });
const highPositions = [];
for (let i = 0; i < 800; i++) {
    const radius = 60 + Math.random() * 120;
    const angle = Math.random() * Math.PI * 2;
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;
    const y = 45 + Math.random() * 45;
    highPositions.push(x, y, z);
}
const highGeo = new THREE.BufferGeometry();
highGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(highPositions), 3));
const highPoints = new THREE.Points(highGeo, highMat);
cloudGroup.add(highPoints);

scene.add(cloudGroup);
const cloudSystems = [cloudPoints, glowPoints, highPoints];

// ========== 灯光系统 ==========
const ambientLight = new THREE.AmbientLight(0xffffff, 1.8);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xfff5e0, 2.5);
dirLight.position.set(15, 35, 20);
dirLight.castShadow = true;
scene.add(dirLight);

const backLight = new THREE.DirectionalLight(0x88aaff, 1.2);
backLight.position.set(-12, 20, -15);
scene.add(backLight);

const fillLight = new THREE.PointLight(0xffaa66, 0.9);
fillLight.position.set(8, 12, 6);
scene.add(fillLight);

const groundFill = new THREE.PointLight(0xccaa88, 0.8);
groundFill.position.set(0, -2, 0);
scene.add(groundFill);

// ========== 地面 ==========
const groundPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(240, 240),
    new THREE.MeshStandardMaterial({ color: 0x5a8a5a, roughness: 0.85, transparent: true, opacity: 0.5 })
);
groundPlane.rotation.x = -Math.PI/2;
groundPlane.position.y = -0.6;
groundPlane.receiveShadow = true;
scene.add(groundPlane);

const gridHelper = new THREE.GridHelper(220, 40, 0xaaddcc, 0x88aa99);
gridHelper.position.y = -0.55;
gridHelper.material.transparent = true;
gridHelper.material.opacity = 0.4;
scene.add(gridHelper);

// 草地粒子
const grassMat = new THREE.PointsMaterial({ color: 0x7aaa5a, size: 0.15 });
const grassPos = [];
for (let i = 0; i < 2000; i++) {
    grassPos.push((Math.random() - 0.5) * 180, -0.45, (Math.random() - 0.5) * 180);
}
const grassGeo = new THREE.BufferGeometry();
grassGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(grassPos), 3));
scene.add(new THREE.Points(grassGeo, grassMat));

// 星空背景
const starMat = new THREE.PointsMaterial({ color: 0xffeedd, size: 0.2, transparent: true, opacity: 0.4 });
const starPos = [];
for (let i = 0; i < 600; i++) {
    starPos.push((Math.random() - 0.5) * 500, Math.random() * 100 + 20, (Math.random() - 0.5) * 400 - 100);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPos), 3));
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ========== 侧边栏数据 ==========
const buildingParts = [
    { name: "🏯 福建土楼·整体概况", detail: "世界文化遗产｜客家建筑奇迹", content: "福建土楼是中国闽西南客家标志性民居建筑，世界独一无二的大型夯土民居建筑群，2008年列入《世界文化遗产名录》。" },
    { name: "📅 始建与关键朝代节点", detail: "近千年营造史｜明清格局定型", content: "宋元（萌芽期）：客家先民南迁，建造小型夯土防御民居。<br>明（发展期）：形制成熟，圆/方形土楼规模化建造。<br>清（鼎盛期）：建造达顶峰。" },
    { name: "🏛️ 建筑形制与核心参数", detail: "圆形/方形｜400间房｜可容800人", content: "楼高14.4米，直径73米，占地面积5376㎡，墙体底部厚2.5米，房间400间，可容纳800人聚族而居。" },
    { name: "⏳ 营建耗时与用工数据", detail: "跨81年建造｜12万工日", content: "承启楼营造历时81年（1628-1709年），跨越明、清两代，江氏家族三代接力建造。" },
    { name: "🌳 建筑材料", detail: "夯土｜木材｜石材", content: "夯土：红壤土+糯米+红糖+石灰+竹筋，约1.2万m³。<br>木材：闽西优质杉木，约1500m³。<br>石材：花岗岩，约3000m³。" },
    { name: "🏆 文化与建筑价值", detail: "客家文化活化石", content: "居住价值：400间房容纳800人。<br>防御价值：厚达2.5米夯土墙。<br>文化价值：客家营造智慧与宗族文化的物质载体。" }
];

let currentCard = null;
function buildSidebar() {
    const list = document.getElementById('sidebarList');
    list.innerHTML = '';
    buildingParts.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'sidebar-item';
        div.innerHTML = `<div class="title">${item.name}</div><div class="detail">${item.detail}</div>`;
        div.onclick = () => {
            if (currentCard) currentCard.remove();
            const card = document.createElement('div');
            card.className = 'popup-card';
            card.innerHTML = `<button class="close-btn" onclick="this.parentElement.remove(); currentCard=null;">✕</button>${item.content}`;
            document.body.appendChild(card);
            currentCard = card;
            const rect = document.getElementById('sidebar').getBoundingClientRect();
            card.style.left = (rect.left - 415) + 'px';
            card.style.top = rect.top + 50 + 'px';
            document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
            div.classList.add('active');
        };
        list.appendChild(div);
    });
}
buildSidebar();

let sidebarVisible = true;
const sidebarEl = document.getElementById('sidebar');
const sidebarCloseBtn = document.getElementById('sidebarClose');
sidebarCloseBtn.onclick = () => {
    if (sidebarVisible) { sidebarEl.style.right = '-320px'; sidebarVisible = false; sidebarCloseBtn.innerHTML = '☰'; sidebarCloseBtn.style.cssText = 'position:fixed;right:10px;top:50%;background:rgba(20,30,25,0.9);padding:8px 12px;border-radius:30px;font-size:20px;z-index:160'; }
    else { sidebarEl.style.right = '20px'; sidebarVisible = true; sidebarCloseBtn.innerHTML = '✕'; sidebarCloseBtn.style.cssText = ''; }
};

// ========== 模型加载 ==========
const loader = new THREE.GLTFLoader();
let modelLoaded = false;
const loadingPanel = document.getElementById('loadingPanel');
const errorMsgDiv = document.getElementById('errorMsg');

loader.load(MODEL_FILE, (gltf) => {
    const m = gltf.scene;
    const box = new THREE.Box3().setFromObject(m);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    m.position.set(-center.x, -center.y, -center.z);
    const scale = 140 / Math.max(size.x, size.y, size.z);
    m.scale.set(scale, scale, scale);
    m.traverse(child => { if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; if (child.material) child.material.side = THREE.DoubleSide; } });
    scene.add(m);
    modelLoaded = true;
    loadingPanel.style.display = 'none';
    const finalBox = new THREE.Box3().setFromObject(m);
    const finalCenter = finalBox.getCenter(new THREE.Vector3());
    const radius = Math.max(finalBox.getSize(new THREE.Vector3()).x, finalBox.getSize(new THREE.Vector3()).z) / 2;
    camera.position.set(finalCenter.x + radius * 2.2, finalCenter.y + radius * 1.0, finalCenter.z + radius * 2.5);
    controls.target.set(finalCenter.x, finalCenter.y, finalCenter.z);
    controls.update();
}, (xhr) => { loadingPanel.innerHTML = `<div class="spinner"></div>加载中 ${Math.floor(xhr.loaded/xhr.total*100)}%`; }, 
(err) => { loadingPanel.style.display = 'none'; errorMsgDiv.style.display = 'block'; });

// ========== 云层飘移动画 ==========
let animTime = 0;
function animateClouds() {
    animTime += 0.004;
    cloudSystems.forEach(sys => { if (sys) { sys.rotation.y = animTime * 0.08; sys.rotation.x = Math.sin(animTime * 0.12) * 0.03; } });
    if (stars) stars.rotation.y += 0.0003;
}

function animate() {
    requestAnimationFrame(animate);
    animateClouds();
    controls.update();
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

window.goBack = () => { window.location.href = '../index.html'; };
setTimeout(() => { if (!modelLoaded) { loadingPanel.style.display = 'none'; errorMsgDiv.style.display = 'block'; } }, 15000);
</script>
</body>
</html>
